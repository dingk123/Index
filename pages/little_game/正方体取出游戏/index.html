<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体取出游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-header">
        <div class="game-title">📦 3D正方体取出游戏</div>
        <div class="game-description">从左侧3×3×3立方体中点击取出，自动按顺序放置到右侧9*3空地</div>
        <div class="browser-info" id="browser-info"></div>
        <div class="game-instructions-header">
            <div class="instruction-item">🖱️ 点击立方体取出</div>
            <div class="instruction-item">📦 自动按顺序放置到右侧</div>
            <div class="instruction-item">🔄 拖拽3D场景360°查看</div>
            <div class="instruction-item">🏆 取出所有立方体获胜</div>
        </div>
    </div>

    <div class="game-container">
        <div class="source-area">
            <div class="section-title">🎯 3×3×3 立方体源</div>
            <div class="counter">剩余: <span id="source-count">27</span> 个</div>
            
            <div class="chart-container">
                <div id="source-chart" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-bar" style="width: 0%">0%</div>
            </div>
        </div>

        <div class="target-area">
            <div class="section-title">🏗️ 9×3 存储区域</div>
            <div class="counter">已放置: <span id="target-count">0</span> / 27 个</div>
            
            <div class="chart-container">
                <div id="target-chart" style="width: 100%; height: 100%;"></div>
            </div>

            <div class="controls">
                <button class="btn reset" onclick="resetGame()">🔄 重新开始</button>
                <button class="btn" onclick="undoLastMove()">↶ 撤销</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
